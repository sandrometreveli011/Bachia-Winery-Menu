<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bachia Winery</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Georgia', serif;
    }

    body {
      background-color: #0b0b0b;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 10px;
    }

    .menu-image {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .footer {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #c9a96e;
      opacity: 0.8;
    }

    .footer a {
      color: #c9a96e;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

  </style>
</head>
<body>

  <div class="container">
    <img src="Images/Bahc Menu.png" alt="Bachia Winery Menu" class="menu-image"/>
  </div>

</body>
</html>
